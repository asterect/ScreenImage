<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画面イメージエディタ</title>
<style>
/* 画面イメージエディタ
   レイアウト：上にツールバー、左に部品、中央に方眼紙の作業台、右にプロパティ。
   選択枠は朱色。画面イメージ自体が青系になりやすいので、道具側の色と混ざらないようにしている。 */
:root {
  --bg: #E9EDF1;          /* 作業台 */
  --dots: #C9D1DA;        /* 方眼の点 */
  --panel: #FFFFFF;
  --panel-2: #F5F7F9;
  --ink: #17202B;
  --muted: #5B6675;
  --rule: #DADFE6;
  --accent: #E4572E;      /* 選択・主要操作 */
  --accent-ink: #FFFFFF;
  --accent-soft: #FCE7DF;
  --focus: #E4572E;
  --shadow: 0 1px 2px rgba(23, 32, 43, .06), 0 8px 24px rgba(23, 32, 43, .10);

  --font-ui: 'BIZ UDPGothic', 'BIZ UDPゴシック', 'Meiryo UI', 'Yu Gothic UI', 'Hiragino Sans', system-ui, sans-serif;
  --fs-xs: 11px; --fs-s: 12px; --fs-m: 13px; --fs-l: 15px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161B; --dots: #262D36; --panel: #1A1F26; --panel-2: #20262E; --ink: #E5E9EE; --muted: #97A1AE;
    --rule: #2D343E; --accent: #FF7A4D; --accent-ink: #1A0D07; --accent-soft: #3A2219; --focus: #FF7A4D;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161B; --dots: #262D36; --panel: #1A1F26; --panel-2: #20262E; --ink: #E5E9EE; --muted: #97A1AE;
  --rule: #2D343E; --accent: #FF7A4D; --accent-ink: #1A0D07; --accent-soft: #3A2219; --focus: #FF7A4D;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 var(--fs-m)/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.spacer { flex: 1; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: 236px minmax(0, 1fr) 288px;
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "top top top" "pal work insp";
}

/* ---------- ツールバー ---------- */
.topbar {
  grid-area: top; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: var(--fs-l); letter-spacing: .02em; white-space: nowrap; }
.brand-mark { width: 22px; height: 22px; color: var(--accent); }
.doc-title input {
  width: 220px; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 5px 8px; color: var(--muted);
}
.doc-title input:hover { border-color: var(--rule); }
.doc-title input:focus { border-color: var(--accent); color: var(--ink); outline: none; background: var(--panel); }
.toolgroup { display: flex; align-items: center; gap: 4px; padding-left: 12px; border-left: 1px solid var(--rule); }
.toolgroup:first-of-type { border-left: 0; }
.icon-btn, .zoom-label, .btn {
  border: 1px solid transparent; background: transparent; border-radius: 6px; cursor: pointer; white-space: nowrap;
}
.icon-btn { width: 30px; height: 30px; display: grid; place-items: center; color: var(--muted); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn:hover, .zoom-label:hover, .btn.ghost:hover { background: var(--panel-2); color: var(--ink); }
.icon-btn:disabled { opacity: .35; cursor: default; background: transparent; }
.zoom-label { min-width: 52px; height: 30px; font-variant-numeric: tabular-nums; color: var(--ink); }
.check { display: inline-flex; align-items: center; gap: 5px; margin-left: 6px; color: var(--muted); font-size: var(--fs-s); cursor: pointer; white-space: nowrap; }
.check input { accent-color: var(--accent); margin: 0; }
.btn { height: 32px; padding: 0 12px; font-size: var(--fs-m); }
.btn.ghost { color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.small { height: 28px; padding: 0 10px; font-size: var(--fs-s); }
.btn.danger { color: #C2382A; }
.btn.outline { border-color: var(--rule); background: var(--panel); }
.btn.outline:hover { border-color: var(--muted); }

/* ---------- 部品パレット ---------- */
.palette { grid-area: pal; display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--rule); }
.pane-head { padding: 14px 14px 10px; display: grid; gap: 8px; }
.pane-head h2 { margin: 0; font-size: var(--fs-s); letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.pane-head input {
  width: 100%; height: 32px; border: 1px solid var(--rule); border-radius: 6px; padding: 0 10px; background: var(--panel-2);
}
.pane-head input:focus { outline: none; border-color: var(--accent); background: var(--panel); }
.palette-body { flex: 1; overflow: auto; padding: 0 10px 12px; }
.cat { margin-top: 10px; }
.cat h3 { margin: 0 4px 6px; font-size: var(--fs-xs); letter-spacing: .14em; color: var(--muted); font-weight: 700; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tile {
  display: grid; grid-template-rows: 44px auto; gap: 4px; padding: 6px 6px 7px; border: 1px solid var(--rule); border-radius: 7px;
  background: var(--panel); cursor: grab; text-align: center; font-size: var(--fs-s); color: var(--ink); user-select: none;
}
.tile:hover { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tile:active { cursor: grabbing; }
.tile .thumb { background: #FFFFFF; border-radius: 4px; display: grid; place-items: center; overflow: hidden; }
.tile .thumb svg { width: 100%; height: 100%; }
.pane-foot { margin: 0; padding: 10px 14px; border-top: 1px solid var(--rule); color: var(--muted); font-size: var(--fs-xs); }

/* ---------- 作業台 ---------- */
.workspace { grid-area: work; display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; min-height: 0; }
.stage {
  overflow: auto; position: relative; outline: none;
  background-color: var(--bg);
  background-image: radial-gradient(var(--dots) 1px, transparent 1.2px);
  background-size: 16px 16px;
}
.screen-wrap { position: relative; margin: 40px; }
.screen {
  position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #FFFFFF;
  box-shadow: var(--shadow); outline: 1px solid rgba(23, 32, 43, .08);
  touch-action: none;
}
.screen.show-grid {
  background-image:
    linear-gradient(to right, rgba(36, 87, 197, .07) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(36, 87, 197, .07) 1px, transparent 1px);
  background-size: 16px 16px;
}
.items, .overlay { position: absolute; inset: 0; }
.overlay { pointer-events: none; }
.item { position: absolute; cursor: move; }
.item svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; font-family: 'Meiryo UI', 'Yu Gothic UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif; }
.item:hover { outline: calc(1px / var(--z, 1)) dashed var(--accent); outline-offset: calc(1px / var(--z, 1)); }
.item.missing { background: repeating-linear-gradient(45deg, #FDECEC 0 8px, #FFF 8px 16px); border: 1px dashed #C2382A; color: #C2382A; font-size: 12px; display: grid; place-items: center; }
.sel { position: absolute; border: calc(1.5px / var(--z, 1)) solid var(--accent); }
.handle {
  position: absolute; width: calc(9px / var(--z, 1)); height: calc(9px / var(--z, 1));
  margin: calc(-4.5px / var(--z, 1)) 0 0 calc(-4.5px / var(--z, 1));
  background: #FFFFFF; border: calc(1.5px / var(--z, 1)) solid var(--accent); border-radius: calc(2px / var(--z, 1));
  pointer-events: auto;
}
.handle[data-dir="n"], .handle[data-dir="s"] { cursor: ns-resize; }
.handle[data-dir="e"], .handle[data-dir="w"] { cursor: ew-resize; }
.handle[data-dir="nw"], .handle[data-dir="se"] { cursor: nwse-resize; }
.handle[data-dir="ne"], .handle[data-dir="sw"] { cursor: nesw-resize; }
.sel.member { border-width: calc(1px / var(--z, 1)); border-color: rgba(228, 87, 46, .55); }
.group-box {
  position: absolute; border: calc(1.5px / var(--z, 1)) dashed var(--accent);
  margin: calc(-4px / var(--z, 1)); padding: calc(4px / var(--z, 1)); box-sizing: content-box;
}
.group-box.inner { border-color: var(--muted); border-width: calc(1px / var(--z, 1)); }
/* 文字が収まっていない部品の目印（右上の小さな「…」） */
.item.overflow::after {
  content: '…'; position: absolute; right: calc(-7px / var(--z, 1)); top: calc(-7px / var(--z, 1));
  width: calc(16px / var(--z, 1)); height: calc(16px / var(--z, 1)); border-radius: 50%;
  background: #D97706; color: #FFFFFF; font: 700 calc(11px / var(--z, 1))/calc(14px / var(--z, 1)) var(--font-ui); text-align: center;
  pointer-events: none;
}
.marquee { position: absolute; border: calc(1px / var(--z, 1)) solid var(--accent); background: rgba(228, 87, 46, .08); }
.size-tip {
  position: absolute; transform: translate(-50%, 0); padding: 2px 6px; border-radius: 4px;
  background: var(--accent); color: #FFFFFF; font-size: calc(11px / var(--z, 1)); white-space: nowrap; font-variant-numeric: tabular-nums;
}
.stage.drop-ok .screen { outline: 2px solid var(--accent); }

/* ---------- ページ ---------- */
.pagebar {
  display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--panel); border-top: 1px solid var(--rule);
  overflow-x: auto;
}
.pages { display: flex; gap: 4px; }
.page-tab {
  height: 28px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--rule); background: var(--panel-2); cursor: pointer;
  font-size: var(--fs-s); white-space: nowrap; color: var(--muted);
}
.page-tab[aria-selected="true"] { background: var(--panel); color: var(--ink); border-color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); font-weight: 700; }
.page-tab .num { font-variant-numeric: tabular-nums; margin-right: 6px; color: var(--muted); font-weight: 400; }
.status { color: var(--muted); font-size: var(--fs-xs); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ---------- プロパティ ---------- */
.inspector { grid-area: insp; background: var(--panel); border-left: 1px solid var(--rule); min-height: 0; display: flex; flex-direction: column; }
.inspector-body { overflow: auto; flex: 1; }
.insp-section { padding: 14px 16px; border-bottom: 1px solid var(--rule); display: grid; gap: 10px; }
.insp-section h2 { margin: 0; font-size: var(--fs-l); font-weight: 700; text-wrap: balance; }
.insp-section h3 { margin: 0; font-size: var(--fs-xs); letter-spacing: .14em; color: var(--muted); font-weight: 700; }
.insp-kind { color: var(--muted); font-size: var(--fs-xs); letter-spacing: .08em; }
.geo { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.geo label { display: grid; gap: 2px; font-size: var(--fs-xs); color: var(--muted); }
.field { display: grid; gap: 4px; }
.field > span { font-size: var(--fs-s); color: var(--muted); }
.field input[type="text"], .field input[type="number"], .field textarea, .field select, .geo input {
  width: 100%; min-width: 0; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); padding: 6px 8px;
  font-variant-numeric: tabular-nums;
}
.field textarea { min-height: 84px; resize: vertical; line-height: 1.5; }
.field input:focus, .field textarea:focus, .field select:focus, .geo input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field.bool { grid-template-columns: auto 1fr; align-items: center; gap: 8px; }
.field.bool > span { color: var(--ink); font-size: var(--fs-m); }
.field.bool input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.color-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 6px; align-items: center; }
.color-row input[type="color"] { width: 34px; height: 32px; padding: 2px; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); cursor: pointer; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--rule); cursor: pointer; padding: 0; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.align-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.align-grid .btn { padding: 0 4px; font-size: var(--fs-s); }
.hint { margin: 0; color: var(--muted); font-size: var(--fs-s); line-height: 1.7; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 0; font-size: var(--fs-s); }
.keys dt { font-variant-numeric: tabular-nums; }
.keys kbd { display: inline-block; min-width: 20px; padding: 0 5px; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; background: var(--panel-2); font: inherit; font-size: var(--fs-xs); text-align: center; }
.keys dd { margin: 0; color: var(--muted); }

/* ---------- 通知 ---------- */
.toast {
  position: fixed; left: 50%; bottom: 56px; transform: translateX(-50%); z-index: 50;
  background: var(--ink); color: var(--panel); padding: 9px 16px; border-radius: 8px; box-shadow: var(--shadow); font-size: var(--fs-m);
  max-width: calc(100% - 32px);
}
.toast.error { background: #B42318; color: #FFFFFF; }

/* ---------- 狭い画面 ---------- */
@media (max-width: 900px) {
  .app {
    height: auto; min-height: 100%;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto 70vh auto;
    grid-template-areas: "top" "pal" "work" "insp";
  }
  .topbar { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .toolgroup { border-left: 0; padding-left: 0; }
  .palette { border-right: 0; border-bottom: 1px solid var(--rule); max-height: 260px; }
  .tiles { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
  .inspector { border-left: 0; border-top: 1px solid var(--rule); }
  .screen-wrap { margin: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

</style>
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="3.5" width="19" height="17" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M2.5 8h19" stroke="currentColor" stroke-width="1.6"/><rect x="5.5" y="10.5" width="5" height="7" rx="1" fill="currentColor"/><path d="M13 11.5h6M13 14.5h6M13 17.5h3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>画面イメージエディタ</span>
    </div>
    <label class="doc-title"><span class="sr-only">資料名</span><input id="docTitle" type="text" spellcheck="false"></label>

    <div class="toolgroup" role="group" aria-label="編集">
      <button class="icon-btn" id="btnUndo" title="元に戻す（Ctrl+Z）" aria-label="元に戻す"><svg viewBox="0 0 20 20"><path d="M7 5 3 9l4 4M3.5 9H12a5 5 0 0 1 0 10h-2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="icon-btn" id="btnRedo" title="やり直す（Ctrl+Y）" aria-label="やり直す"><svg viewBox="0 0 20 20"><path d="m13 5 4 4-4 4M16.5 9H8a5 5 0 0 0 0 10h2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="toolgroup" role="group" aria-label="表示">
      <button class="icon-btn" id="btnZoomOut" title="縮小" aria-label="縮小"><svg viewBox="0 0 20 20"><path d="M5 10h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <button class="zoom-label" id="btnZoomFit" title="画面に合わせる">100%</button>
      <button class="icon-btn" id="btnZoomIn" title="拡大" aria-label="拡大"><svg viewBox="0 0 20 20"><path d="M5 10h10M10 5v10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <label class="check" title="8px 単位で揃える（Alt を押しながら動かすと無効）"><input type="checkbox" id="optSnap" checked><span>グリッドに吸着</span></label>
      <label class="check"><input type="checkbox" id="optGrid" checked><span>方眼</span></label>
    </div>

    <div class="spacer"></div>

    <div class="toolgroup files" role="group" aria-label="ファイル">
      <button class="btn ghost" id="btnNew">新規</button>
      <button class="btn ghost" id="btnOpen">開く</button>
      <button class="btn ghost" id="btnSave" title="編集データを保存（Ctrl+S）">保存</button>
      <input type="file" id="fileOpen" accept=".json,application/json" hidden>
    </div>
    <div class="toolgroup" role="group" aria-label="出力">
      <button class="btn ghost" id="btnCopyImg" title="表示中のページを画像としてコピー（Excel にそのまま貼り付け可）">画像をコピー</button>
      <button class="btn ghost" id="btnPng">PNG</button>
      <button class="btn primary" id="btnPptx">PowerPoint 出力</button>
    </div>
  </header>

  <aside class="palette" aria-label="部品">
    <div class="pane-head">
      <h2>部品</h2>
      <input id="paletteSearch" type="search" placeholder="部品を探す" aria-label="部品を探す">
    </div>
    <div class="palette-body" id="palette"></div>
    <p class="pane-foot">ドラッグして配置、またはクリックで中央に追加</p>
  </aside>

  <main class="workspace">
    <div class="stage" id="stage" tabindex="-1">
      <div class="screen-wrap" id="screenWrap">
        <div class="screen" id="screen">
          <div class="items" id="items"></div>
          <div class="overlay" id="overlay"></div>
        </div>
      </div>
    </div>
    <nav class="pagebar" aria-label="ページ">
      <div class="pages" id="pages" role="tablist"></div>
      <button class="btn ghost small" id="btnAddPage">＋ ページ追加</button>
      <span class="spacer"></span>
      <span class="status" id="status"></span>
    </nav>
  </main>

  <aside class="inspector" aria-label="プロパティ">
    <div class="inspector-body" id="inspector"></div>
  </aside>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<!-- 本体 -->
<script>/* core/registry.js */
/*
 * 部品レジストリ
 * ------------------------------------------------------------
 * 部品は GamenUI.register({...}) で登録する。1つの定義から
 *   - エディタ上の表示（SVG）
 *   - PowerPoint 出力（図形・表）
 *   - パレットのサムネイル
 *   - プロパティ欄の入力項目
 * がすべて生成される。部品を増やすときは components/ にファイルを足し、
 * index.html に <script> を1行追加するだけでよい。
 *
 * 定義の形:
 * {
 *   type: 'button',            // 一意な識別子（英数字）
 *   name: 'ボタン',             // パレットに出る名前
 *   category: '入力',           // パレットの分類
 *   size: { w: 120, h: 40 },   // 配置したときの初期サイズ(px)
 *   props: [                   // プロパティ欄の項目
 *     { key: 'label', label: '表示文字', type: 'text', default: '登録' },
 *   ],
 *   draw(p, w, h, ctx) { return [ ...プリミティブ ]; }
 * }
 *
 * props の type: text / textarea / number / color / select / bool
 *   select は options: [['値','表示名'], ...]
 *   color は '' を「テーマ色」として扱う（ctx.color() で解決）
 *
 * プリミティブ（座標は部品の左上を原点とした px）:
 *   { t:'rect',    x,y,w,h, fill, stroke, sw, r, dash }
 *   { t:'ellipse', x,y,w,h, fill, stroke, sw, dash }
 *   { t:'line',    x1,y1,x2,y2, stroke, sw, dash }
 *   { t:'tri',     x,y,w,h, fill, dir:'up'|'down'|'left'|'right' }
 *   { t:'text',    x,y,w,h, text, size, color, bold, align:'left'|'center'|'right', valign:'top'|'middle'|'bottom' }
 *                  fit:'wrap'（折り返し＋収まらない分は…）|'ellipsis'（1行ごとに…）  … 省略時ははみ出す
 *   { t:'text',    x,y,w,h, runs:[{ text, size, bold, color }], align, valign }   … 1行の中で大きさや色を変える
 *   { t:'table',   x,y,w,h, columns:[...], rows:[[...]], colRatios, size,
 *                  headerFill, headerColor, border, stripe, align:[...] }
 */
(function () {
  'use strict';

  const defs = new Map();
  const order = [];

  const PROP_TYPES = ['text', 'textarea', 'number', 'color', 'select', 'bool'];

  function register(def) {
    const where = def && def.type ? `部品「${def.type}」` : '部品';
    if (!def || !/^[a-zA-Z][\w-]*$/.test(def.type || '')) throw new Error(`${where}: type は英数字で指定してください`);
    if (defs.has(def.type)) throw new Error(`${where}: 同じ type がすでに登録されています`);
    if (typeof def.draw !== 'function') throw new Error(`${where}: draw(p, w, h, ctx) が必要です`);
    def.name = def.name || def.type;
    def.category = def.category || 'その他';
    def.size = def.size || { w: 160, h: 40 };
    def.props = (def.props || []).map((p) => {
      if (!PROP_TYPES.includes(p.type)) throw new Error(`${where}: プロパティ「${p.key}」の type「${p.type}」は未対応です`);
      return { label: p.key, ...p };
    });
    defs.set(def.type, def);
    order.push(def.type);
  }

  function defaults(type) {
    const def = defs.get(type);
    const out = {};
    if (def) def.props.forEach((p) => { out[p.key] = p.default !== undefined ? p.default : ''; });
    return out;
  }

  function categories() {
    const seen = [];
    order.forEach((t) => { const c = defs.get(t).category; if (!seen.includes(c)) seen.push(c); });
    return seen;
  }

  window.GamenUI = {
    register,
    get: (type) => defs.get(type),
    all: () => order.map((t) => defs.get(t)),
    defaults,
    categories,
  };
})();

</script>
<script>/* core/render.js */
/*
 * 描画まわり
 *  - makeCtx(theme): 部品の draw() に渡すヘルパー群
 *  - toSVG(prims):   プリミティブ配列を SVG 要素の文字列に変換
 *  - tableLayout():  表の列幅・行位置の計算（SVG と PowerPoint で共通）
 */
(function () {
  'use strict';

  // 画面イメージ内の文字に使うフォント。PowerPoint 出力も同じフォント名を指定する。
  const FONT_NAME = 'Meiryo UI';
  const FONT_STACK = "'Meiryo UI', 'Yu Gothic UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif";
  const LINE_HEIGHT = 1.35;

  // 部品で共通して使う色
  const C = {
    ink: '#1F2937', sub: '#64748B', faint: '#94A3B8', line: '#CBD5E1', lineSoft: '#E2E8F0',
    soft: '#F1F5F9', softer: '#F8FAFC', paper: '#FFFFFF',
    danger: '#DC2626', success: '#16A34A', warning: '#D97706', info: '#2563EB',
  };

  function hexToRgb(hex) {
    let h = String(hex || '').replace('#', '').trim();
    if (h.length === 3) h = h.split('').map((c) => c + c).join('');
    if (!/^[0-9a-fA-F]{6}$/.test(h)) return [0, 0, 0];
    return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16));
  }
  function rgbToHex(rgb) {
    return '#' + rgb.map((v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('').toUpperCase();
  }
  function mix(hex, target, t) {
    const a = hexToRgb(hex);
    return rgbToHex(a.map((v, i) => v + (target[i] - v) * t));
  }

  let measureCanvas = null;
  function measure(text, size, bold) {
    if (!measureCanvas) measureCanvas = document.createElement('canvas').getContext('2d');
    measureCanvas.font = `${bold ? 'bold ' : ''}${size}px ${FONT_STACK}`;
    const lines = String(text == null ? '' : text).split('\n');
    return Math.max(...lines.map((l) => measureCanvas.measureText(l).width));
  }

  // 「A,B,C」や「A、B、C」を配列にする
  function list(value) {
    return String(value == null ? '' : value).split(/[,、，]/).map((s) => s.trim()).filter((s) => s !== '');
  }
  function lines(value) {
    return String(value == null ? '' : value).split(/\r?\n/).map((s) => s.trim()).filter((s) => s !== '');
  }

  function makeCtx(theme) {
    const primary = (theme && theme.primary) || '#2457C5';
    return {
      C,
      FONT_NAME,
      theme: { primary },
      color: (c) => c || primary,
      tint: (hex, t) => mix(hex, [255, 255, 255], t),
      shade: (hex, t) => mix(hex, [0, 0, 0], t),
      // 背景色の上で読みやすい文字色（白 or 濃い灰）
      onColor: (bg) => {
        const [r, g, b] = hexToRgb(bg || primary).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; });
        return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.45 ? C.ink : '#FFFFFF';
      },
      measure,
      list,
      lines,
    };
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  const n = (v) => Math.round((Number(v) || 0) * 100) / 100;

  function strokeAttrs(p) {
    if (!p.stroke) return 'stroke="none"';
    const sw = p.sw == null ? 1 : p.sw;
    return `stroke="${esc(p.stroke)}" stroke-width="${n(sw)}"${p.dash ? ` stroke-dasharray="${n(sw * 4)} ${n(sw * 3)}"` : ''}`;
  }

  // 数値・金額らしいセルは右寄せ
  // 0 で始まる番号（顧客番号など）はコードとみなして左寄せのまま
  function isNumeric(s) {
    const t = String(s).trim();
    if (/^0\d/.test(t)) return false;
    return /^[-+]?[¥￥$]?[\d,]+(\.\d+)?(円|%|件)?$/.test(t);
  }

  function tableLayout(p) {
    const cols = p.columns.length || 1;
    let ratios = (p.colRatios || []).map(Number).filter((v) => v > 0);
    if (ratios.length !== cols) ratios = new Array(cols).fill(1);
    const total = ratios.reduce((a, b) => a + b, 0);
    const colW = [];
    let acc = 0;
    ratios.forEach((r, i) => {
      const w = i === cols - 1 ? p.w - acc : Math.round((p.w * r) / total);
      colW.push(w);
      acc += w;
    });
    const colX = [];
    acc = 0;
    colW.forEach((w) => { colX.push(acc); acc += w; });
    const rowCount = p.rows.length + 1;
    const rowH = p.h / rowCount;
    const align = p.columns.map((_, ci) => {
      if (p.align && p.align[ci]) return p.align[ci];
      const body = p.rows.map((r) => r[ci]).filter((v) => v != null && v !== '');
      return body.length && body.every(isNumeric) ? 'right' : 'left';
    });
    return { colW, colX, rowH, rowCount, align };
  }

  // 大きさの違う文字を1行に並べる（例：「3,250,000」＋「円」）。ベースラインを揃える。
  function runsSVG(p) {
    const runs = p.runs.filter((r) => r && r.text != null && r.text !== '');
    const maxSize = Math.max(...runs.map((r) => r.size || 14), 1);
    const va = p.valign || 'middle';
    const base = va === 'top' ? p.y + maxSize * 1.05 : va === 'bottom' ? p.y + p.h - maxSize * 0.3 : p.y + p.h / 2 + maxSize * 0.36;
    const al = p.align || 'left';
    const x = al === 'center' ? p.x + p.w / 2 : al === 'right' ? p.x + p.w : p.x;
    const anchor = al === 'center' ? 'middle' : al === 'right' ? 'end' : 'start';
    return `<text x="${n(x)}" y="${n(base)}" text-anchor="${anchor}">` + runs.map((r) =>
      `<tspan font-size="${n(r.size || 14)}"${r.bold ? ' font-weight="bold"' : ''} fill="${esc(r.color || C.ink)}">${esc(r.text)}</tspan>`).join('') + '</text>';
  }

  // ---- 文字の折り返し・省略 ----------------------------------------------
  // fit: 'wrap'     … 幅で折り返し、高さに収まらない分は最終行を「…」で省略
  //      'ellipsis' … 折り返さず、幅を超えたら「…」で省略（改行は残す）
  //      なし       … そのまま（はみ出しても描く）
  // 画面・PNG・PowerPoint の3つで同じ結果になるよう、改行位置はここで決めて渡す。
  const NO_LINE_START = '、。，．,.）)］]｝}」』〉》】〕・：；:;！!？?ーぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮヵヶ々〜…';
  let overflowHit = false; // 直近の描画で文字が収まらなかったか（エディタの警告表示用）

  function ellipsize(line, size, bold, w) {
    if (measure(line, size, bold) <= w) return line;
    let s = line;
    while (s.length && measure(s + '…', size, bold) > w) s = s.slice(0, -1);
    return s + '…';
  }

  function wrapParagraph(text, size, bold, w) {
    const out = [];
    let cur = '';
    for (const ch of text) {
      if (cur === '' && ch === ' ') continue;
      if (measure(cur + ch, size, bold) <= w || cur === '') { cur += ch; continue; }
      if (NO_LINE_START.includes(ch)) { out.push(cur + ch); cur = ''; continue; } // 句読点は行頭に置かない
      const sp = cur.lastIndexOf(' ');
      if (/[A-Za-z0-9]/.test(ch) && sp > 0 && /[A-Za-z0-9]$/.test(cur)) { // 英単語は途中で切らない
        out.push(cur.slice(0, sp));
        cur = cur.slice(sp + 1) + ch;
      } else { out.push(cur); cur = ch; }
    }
    out.push(cur);
    return out;
  }

  function fitText(p) {
    const size = p.size || 14;
    const raw = String(p.text == null ? '' : p.text).split('\n');
    if (!p.fit || !(p.w > 0)) return raw;
    const lh = size * LINE_HEIGHT;
    const maxLines = Math.max(1, Math.floor((p.h + 0.5) / lh));
    let lines = p.fit === 'wrap' ? raw.flatMap((l) => wrapParagraph(l, size, p.bold, p.w)) : raw.slice();
    let cut = false;
    if (lines.length > maxLines) { lines = lines.slice(0, maxLines); cut = true; }
    lines = lines.map((l) => { const f = ellipsize(l, size, p.bold, p.w); if (f !== l) cut = true; return f; });
    if (cut) {
      const i = lines.length - 1;
      if (!lines[i].endsWith('…')) lines[i] = ellipsize(lines[i] + '…', size, p.bold, p.w);
    }
    if (cut) overflowHit = true;
    return lines;
  }

  function textSVG(p) {
    if (Array.isArray(p.runs)) return runsSVG(p);
    const size = p.size || 14;
    const lh = size * LINE_HEIGHT;
    const ls = fitText(p);
    const block = ls.length * lh;
    const va = p.valign || 'middle';
    const top = va === 'top' ? p.y : va === 'bottom' ? p.y + p.h - block : p.y + (p.h - block) / 2;
    const al = p.align || 'left';
    const x = al === 'center' ? p.x + p.w / 2 : al === 'right' ? p.x + p.w : p.x;
    const anchor = al === 'center' ? 'middle' : al === 'right' ? 'end' : 'start';
    return ls.map((line, i) => `<text x="${n(x)}" y="${n(top + lh * i + lh / 2)}" font-size="${n(size)}"` +
      `${p.bold ? ' font-weight="bold"' : ''} fill="${esc(p.color || C.ink)}" text-anchor="${anchor}" dominant-baseline="central">${esc(line)}</text>`).join('');
  }

  function tableSVG(p) {
    const L = tableLayout(p);
    const size = p.size || 13;
    const border = p.border || C.line;
    let s = `<g transform="translate(${n(p.x)} ${n(p.y)})">`;
    s += `<rect x="0" y="0" width="${n(p.w)}" height="${n(L.rowH)}" fill="${esc(p.headerFill || C.soft)}"/>`;
    if (p.stripe) {
      p.rows.forEach((_, ri) => {
        if (ri % 2 === 1) s += `<rect x="0" y="${n(L.rowH * (ri + 1))}" width="${n(p.w)}" height="${n(L.rowH)}" fill="${C.softer}"/>`;
      });
    }
    for (let r = 1; r < L.rowCount; r++) {
      s += `<line x1="0" y1="${n(L.rowH * r)}" x2="${n(p.w)}" y2="${n(L.rowH * r)}" stroke="${esc(border)}" stroke-width="1"/>`;
    }
    L.colX.slice(1).forEach((x) => {
      s += `<line x1="${n(x)}" y1="0" x2="${n(x)}" y2="${n(p.h)}" stroke="${esc(border)}" stroke-width="1"/>`;
    });
    s += `<rect x="0" y="0" width="${n(p.w)}" height="${n(p.h)}" fill="none" stroke="${esc(border)}" stroke-width="1"/>`;
    const pad = 8;
    const cell = (text, ci, ri, bold, color) => {
      const al = ri === 0 ? (L.align[ci] === 'right' ? 'right' : 'left') : L.align[ci];
      return textSVG({ x: L.colX[ci] + pad, y: L.rowH * ri, w: L.colW[ci] - pad * 2, h: L.rowH, text, size, bold, color, align: al, fit: 'wrap' });
    };
    p.columns.forEach((c, ci) => { s += cell(c, ci, 0, true, p.headerColor || C.ink); });
    p.rows.forEach((row, ri) => p.columns.forEach((_, ci) => { s += cell(row[ci] == null ? '' : row[ci], ci, ri + 1, false, C.ink); }));
    return s + '</g>';
  }

  function triPoints(p) {
    const { x, y, w, h } = p;
    switch (p.dir) {
      case 'up': return [[x + w / 2, y], [x + w, y + h], [x, y + h]];
      case 'left': return [[x, y + h / 2], [x + w, y], [x + w, y + h]];
      case 'right': return [[x, y], [x + w, y + h / 2], [x, y + h]];
      default: return [[x, y], [x + w, y], [x + w / 2, y + h]];
    }
  }

  function toSVG(prims) {
    return (prims || []).map((p) => {
      switch (p.t) {
        case 'rect':
          return `<rect x="${n(p.x)}" y="${n(p.y)}" width="${n(Math.max(0, p.w))}" height="${n(Math.max(0, p.h))}"` +
            `${p.r ? ` rx="${n(p.r)}"` : ''} fill="${esc(p.fill || 'none')}" ${strokeAttrs(p)}/>`;
        case 'ellipse':
          return `<ellipse cx="${n(p.x + p.w / 2)}" cy="${n(p.y + p.h / 2)}" rx="${n(p.w / 2)}" ry="${n(p.h / 2)}" fill="${esc(p.fill || 'none')}" ${strokeAttrs(p)}/>`;
        case 'line': {
          const stroke = p.stroke || C.ink;
          if (!p.arrow) {
            return `<line x1="${n(p.x1)}" y1="${n(p.y1)}" x2="${n(p.x2)}" y2="${n(p.y2)}" ${strokeAttrs({ ...p, stroke })} stroke-linecap="round"/>`;
          }
          // 終点に矢じり（PowerPoint の「三角」矢じりに近い大きさ）
          const sw = p.sw == null ? 1 : p.sw;
          const len = Math.max(8, sw * 3.5), half = Math.max(4, sw * 1.75);
          const a = Math.atan2(p.y2 - p.y1, p.x2 - p.x1);
          const bx = p.x2 - Math.cos(a) * len, by = p.y2 - Math.sin(a) * len;
          const pts = [[p.x2, p.y2], [bx - Math.sin(a) * half, by + Math.cos(a) * half], [bx + Math.sin(a) * half, by - Math.cos(a) * half]];
          return `<line x1="${n(p.x1)}" y1="${n(p.y1)}" x2="${n(bx)}" y2="${n(by)}" ${strokeAttrs({ ...p, stroke })}/>` +
            `<polygon points="${pts.map((pt) => pt.map(n).join(',')).join(' ')}" fill="${esc(stroke)}"/>`;
        }
        case 'tri':
          return `<polygon points="${triPoints(p).map((pt) => pt.map(n).join(',')).join(' ')}" fill="${esc(p.fill || C.ink)}"/>`;
        case 'text':
          return textSVG(p);
        case 'table':
          return tableSVG(p);
        default:
          return '';
      }
    }).join('');
  }

  // 1部品をサイズ付きの SVG 文字列にする（パレットのサムネイルや PNG 出力用）
  function itemSVG(def, props, w, h, ctx) {
    let prims = [];
    try { prims = def.draw(props, w, h, ctx) || []; } catch (e) { console.error(def.type, e); }
    overflowHit = false;
    const svg = toSVG(prims);
    itemSVG.overflow = overflowHit;
    return svg;
  }

  window.GamenRender = { makeCtx, toSVG, itemSVG, tableLayout, fitText, FONT_NAME, FONT_STACK, LINE_HEIGHT, C };
})();

</script>
<script>/* core/zip.js */
/*
 * 最小限の ZIP 作成（無圧縮）
 * PowerPoint ファイル（.pptx）は XML を ZIP にまとめたもの。外部ライブラリに頼らず、
 * オフラインでも動くように自前で書いている。
 */
(function () {
  'use strict';

  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      t[i] = c >>> 0;
    }
    return t;
  })();

  function crc32(bytes) {
    let c = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }

  // files: [{ name: 'path/in/zip', data: string | Uint8Array }]
  function makeZip(files) {
    const enc = new TextEncoder();
    const now = new Date();
    const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | Math.floor(now.getSeconds() / 2);
    const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();

    const chunks = [];
    const central = [];
    let offset = 0;

    files.forEach((f) => {
      const name = enc.encode(f.name);
      const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data;
      const crc = crc32(data);

      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true);
      local.setUint16(4, 20, true);
      local.setUint16(6, 0x0800, true); // UTF-8 ファイル名
      local.setUint16(8, 0, true);      // 無圧縮
      local.setUint16(10, dosTime, true);
      local.setUint16(12, dosDate, true);
      local.setUint32(14, crc, true);
      local.setUint32(18, data.length, true);
      local.setUint32(22, data.length, true);
      local.setUint16(26, name.length, true);
      local.setUint16(28, 0, true);
      chunks.push(new Uint8Array(local.buffer), name, data);

      const cen = new DataView(new ArrayBuffer(46));
      cen.setUint32(0, 0x02014b50, true);
      cen.setUint16(4, 20, true);
      cen.setUint16(6, 20, true);
      cen.setUint16(8, 0x0800, true);
      cen.setUint16(10, 0, true);
      cen.setUint16(12, dosTime, true);
      cen.setUint16(14, dosDate, true);
      cen.setUint32(16, crc, true);
      cen.setUint32(20, data.length, true);
      cen.setUint32(24, data.length, true);
      cen.setUint16(28, name.length, true);
      cen.setUint32(42, offset, true);
      central.push(new Uint8Array(cen.buffer), name);

      offset += 30 + name.length + data.length;
    });

    const centralSize = central.reduce((a, c) => a + c.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, files.length, true);
    end.setUint16(10, files.length, true);
    end.setUint32(12, centralSize, true);
    end.setUint32(16, offset, true);

    return new Blob([...chunks, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
  }

  window.GamenZip = { makeZip, crc32 };
})();

</script>
<script>/* core/pptx-template.js */

  const NS = 'xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" ' +
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ' +
    'xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main"';
  const HEAD = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  const REL = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';

  const emu = (px) => Math.round((Number(px) || 0) * EMU);
  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
    // XML で使えない制御文字を除く
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
  const hex = (c) => {
    let h = String(c || '').replace('#', '').trim();
    if (h.length === 3) h = h.split('').map((x) => x + x).join('');
    return /^[0-9a-fA-F]{6}$/.test(h) ? h.toUpperCase() : null;
  };

  class Slide {
    constructor() { this.nextId = 2; this.parts = []; }
    id() { return this.nextId++; }
  }

  function fillXml(color) {
    const h = hex(color);
    return h ? `<a:solidFill><a:srgbClr val="${h}"/></a:solidFill>` : '<a:noFill/>';
  }
  function lnXml(p, defaultStroke) {
    const h = hex(p.stroke || defaultStroke);
    if (!h) return '<a:ln><a:noFill/></a:ln>';
    const w = emu(p.sw == null ? 1 : p.sw);
    return `<a:ln w="${Math.max(w, 1)}"><a:solidFill><a:srgbClr val="${h}"/></a:solidFill>` +
      `${p.dash ? '<a:prstDash val="dash"/>' : ''}${p.arrow ? '<a:tailEnd type="triangle" w="med" len="med"/>' : ''}</a:ln>`;
  }
  function xfrm(x, y, w, h, extra) {
    return `<a:xfrm${extra || ''}><a:off x="${emu(x)}" y="${emu(y)}"/><a:ext cx="${Math.max(emu(w), 0)}" cy="${Math.max(emu(h), 0)}"/></a:xfrm>`;
  }
  function nv(slide, name, txBox) {
    return `<p:nvSpPr><p:cNvPr id="${slide.id()}" name="${esc(name)}"/><p:cNvSpPr${txBox ? ' txBox="1"' : ''}/><p:nvPr/></p:nvSpPr>`;
  }

  function runXml(text, size, bold, color, fontName) {
    const sz = Math.max(100, Math.round(size * 0.75 * 100));
    const props = `lang="ja-JP" altLang="en-US" sz="${sz}"${bold ? ' b="1"' : ' b="0"'} dirty="0"`;
    const font = `<a:latin typeface="${esc(fontName)}"/><a:ea typeface="${esc(fontName)}"/>`;
    const fill = `<a:solidFill><a:srgbClr val="${hex(color) || '1F2937'}"/></a:solidFill>`;
    if (text === '') return `<a:endParaRPr ${props}>${fill}${font}</a:endParaRPr>`;
    return `<a:r><a:rPr ${props}>${fill}${font}</a:rPr><a:t>${esc(text)}</a:t></a:r>`;
  }

  function shapeXml(slide, p, ox, oy, R) {
    const x = ox + (p.x || 0);
    const y = oy + (p.y || 0);
    switch (p.t) {
      case 'rect':
      case 'ellipse': {
        let geom;
        if (p.t === 'ellipse') geom = '<a:prstGeom prst="ellipse"><a:avLst/></a:prstGeom>';
        else if (p.r) {
          const adj = Math.min(50000, Math.round((p.r / Math.max(1, Math.min(p.w, p.h))) * 100000));
          geom = `<a:prstGeom prst="roundRect"><a:avLst><a:gd name="adj" fmla="val ${adj}"/></a:avLst></a:prstGeom>`;
        } else geom = '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom>';
        return `<p:sp>${nv(slide, p.t === 'ellipse' ? '円' : '四角形')}<p:spPr>${xfrm(x, y, p.w, p.h)}${geom}${fillXml(p.fill)}${lnXml(p)}</p:spPr></p:sp>`;
      }
      case 'line': {
        const x1 = ox + p.x1, y1 = oy + p.y1, x2 = ox + p.x2, y2 = oy + p.y2;
        const flip = `${x2 < x1 ? ' flipH="1"' : ''}${y2 < y1 ? ' flipV="1"' : ''}`;
        return `<p:cxnSp><p:nvCxnSpPr><p:cNvPr id="${slide.id()}" name="線"/><p:cNvCxnSpPr/><p:nvPr/></p:nvCxnSpPr>` +
          `<p:spPr>${xfrm(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1), flip)}` +
          `<a:prstGeom prst="line"><a:avLst/></a:prstGeom>${lnXml(p, R.C.ink)}</p:spPr></p:cxnSp>`;
      }
      case 'tri': {
        // 二等辺三角形は上向き。回転で向きを変える（90度回転では幅と高さを入れ替える）
        const rot = { up: 0, right: 90, down: 180, left: 270 }[p.dir || 'down'] || 0;
        let bx = x, by = y, bw = p.w, bh = p.h;
        if (rot === 90 || rot === 270) { bw = p.h; bh = p.w; bx = x + (p.w - bw) / 2; by = y + (p.h - bh) / 2; }
        return `<p:sp>${nv(slide, '三角形')}<p:spPr>${xfrm(bx, by, bw, bh, rot ? ` rot="${rot * 60000}"` : '')}` +
          `<a:prstGeom prst="triangle"><a:avLst/></a:prstGeom>${fillXml(p.fill || R.C.ink)}<a:ln><a:noFill/></a:ln></p:spPr></p:sp>`;
      }
      case 'text': {
        const size = p.size || 14;
        const algn = { left: 'l', center: 'ctr', right: 'r' }[p.align || 'left'];
        const anchor = { top: 't', middle: 'ctr', bottom: 'b' }[p.valign || 'middle'];
        const spc = Math.round(size * R.LINE_HEIGHT * 0.75 * 100);
        let paras;
        if (Array.isArray(p.runs)) {
          const rs = p.runs.filter((r) => r && r.text != null && r.text !== '');
          paras = `<a:p><a:pPr algn="${algn}"><a:buNone/></a:pPr>${rs.map((r) => runXml(String(r.text), r.size || 14, r.bold, r.color, R.FONT_NAME)).join('')}</a:p>`;
        } else paras = R.fitText(p).map((line) =>
          `<a:p><a:pPr algn="${algn}"><a:lnSpc><a:spcPts val="${spc}"/></a:lnSpc><a:buNone/></a:pPr>` +
          `${runXml(line, size, p.bold, p.color, R.FONT_NAME)}</a:p>`).join('');
        return `<p:sp>${nv(slide, 'テキスト', true)}<p:spPr>${xfrm(x, y, p.w, p.h)}<a:prstGeom prst="rect"><a:avLst/></a:prstGeom><a:noFill/></p:spPr>` +
          `<p:txBody><a:bodyPr wrap="none" lIns="0" tIns="0" rIns="0" bIns="0" anchor="${anchor}" rtlCol="0"><a:noAutofit/></a:bodyPr>` +
          `<a:lstStyle/>${paras}</p:txBody></p:sp>`;
      }
      default:
        return '';
    }
  }

  function tableXml(slide, p, ox, oy, R, name) {
    const L = R.tableLayout(p);
    const size = p.size || 13;
    const border = hex(p.border || R.C.line);
    const ln = (tag) => `<a:${tag} w="${EMU}" cap="flat" cmpd="sng" algn="ctr"><a:solidFill><a:srgbClr val="${border}"/></a:solidFill>` +
      `<a:prstDash val="solid"/></a:${tag}>`;
    const cell = (text, ci, ri) => {
      const header = ri === 0;
      const al = header ? (L.align[ci] === 'right' ? 'right' : 'left') : L.align[ci];
      const algn = { left: 'l', center: 'ctr', right: 'r' }[al];
      let fill = '<a:noFill/>';
      if (header) fill = fillXml(p.headerFill || R.C.soft);
      else if (p.stripe && (ri - 1) % 2 === 1) fill = fillXml(R.C.softer);
      const color = header ? (p.headerColor || R.C.ink) : R.C.ink;
      // 画面と同じ位置で改行・省略する
      const lines = R.fitText({ text: text == null ? '' : String(text), size, bold: header, w: L.colW[ci] - 16, h: L.rowH, fit: 'wrap' });
      const spc = Math.round(size * R.LINE_HEIGHT * 0.75 * 100);
      const paras = lines.map((line) => `<a:p><a:pPr algn="${algn}"><a:lnSpc><a:spcPts val="${spc}"/></a:lnSpc><a:buNone/></a:pPr>` +
        `${runXml(line, size, header, color, R.FONT_NAME)}</a:p>`).join('');
      return `<a:tc><a:txBody><a:bodyPr/><a:lstStyle/>${paras}</a:txBody>` +
        `<a:tcPr marL="${emu(8)}" marR="${emu(8)}" marT="0" marB="0" anchor="ctr">${ln('lnL')}${ln('lnR')}${ln('lnT')}${ln('lnB')}${fill}</a:tcPr></a:tc>`;
    };
    const rowH = emu(L.rowH);
    const rowsXml = [p.columns, ...p.rows].map((row, ri) =>
      `<a:tr h="${rowH}">${p.columns.map((_, ci) => cell(row[ci], ci, ri)).join('')}</a:tr>`).join('');
    return `<p:graphicFrame><p:nvGraphicFramePr><p:cNvPr id="${slide.id()}" name="${esc(name)}"/>` +
      `<p:cNvGraphicFramePr><a:graphicFrameLocks noGrp="1"/></p:cNvGraphicFramePr><p:nvPr/></p:nvGraphicFramePr>` +
      `<p:xfrm><a:off x="${emu(ox + p.x)}" y="${emu(oy + p.y)}"/><a:ext cx="${emu(p.w)}" cy="${rowH * L.rowCount}"/></p:xfrm>` +
      `<a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/table"><a:tbl><a:tblPr firstRow="1"/>` +
      `<a:tblGrid>${L.colW.map((w) => `<a:gridCol w="${emu(w)}"/>`).join('')}</a:tblGrid>${rowsXml}</a:tbl></a:graphicData></a:graphic></p:graphicFrame>`;
  }

  function groupXml(slide, name, box, body) {
    const off = `<a:off x="${emu(box.x)}" y="${emu(box.y)}"/><a:ext cx="${emu(box.w)}" cy="${emu(box.h)}"/>`;
    const ch = `<a:chOff x="${emu(box.x)}" y="${emu(box.y)}"/><a:chExt cx="${emu(box.w)}" cy="${emu(box.h)}"/>`;
    return `<p:grpSp><p:nvGrpSpPr><p:cNvPr id="${slide.id()}" name="${esc(name)}"/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr>` +
      `<p:grpSpPr><a:xfrm>${off}${ch}</a:xfrm></p:grpSpPr>${body}</p:grpSp>`;
  }

  // 1部品分。表は PowerPoint の仕様でグループに入れられないため tables として別に返す。
  function itemXml(slide, item, ctx, R) {
    const def = window.GamenUI.get(item.type);
    if (!def) return { shapes: '', tables: '' };
    let prims = [];
    try { prims = def.draw(item.props, item.w, item.h, ctx) || []; } catch (e) { console.error(item.type, e); return { shapes: '', tables: '' }; }
    const label = def.name + (item.props && (item.props.label || item.props.title || item.props.text) ? `：${String(item.props.label || item.props.title || item.props.text).split('\n')[0]}` : '');
    const tables = prims.filter((p) => p.t === 'table');
    const shapes = prims.filter((p) => p.t !== 'table');
    let out = '';
    if (shapes.length === 1) out = shapeXml(slide, shapes[0], item.x, item.y, R);
    else if (shapes.length > 1) out = groupXml(slide, label, item, shapes.map((p) => shapeXml(slide, p, item.x, item.y, R)).join(''));
    return { shapes: out, tables: tables.map((t) => tableXml(slide, t, item.x, item.y, R, label)).join('') };
  }

  // エディタでグループ化した部品は、PowerPoint でも1つのグループにまとめる
  function slideXml(page, ctx, R) {
    const slide = new Slide();
    const done = new Set();
    let body = '';
    page.items.forEach((it) => {
      if (done.has(it.id)) return;
      if (!it.group) { const x = itemXml(slide, it, ctx, R); body += x.shapes + x.tables; return; }
      const members = page.items.filter((m) => m.group === it.group);
      members.forEach((m) => done.add(m.id));
      const parts = members.map((m) => itemXml(slide, m, ctx, R));
      const inner = parts.map((x) => x.shapes).filter(Boolean);
      const x1 = Math.min(...members.map((m) => m.x)), y1 = Math.min(...members.map((m) => m.y));
      const x2 = Math.max(...members.map((m) => m.x + m.w)), y2 = Math.max(...members.map((m) => m.y + m.h));
      body += inner.length > 1 ? groupXml(slide, 'グループ', { x: x1, y: y1, w: x2 - x1, h: y2 - y1 }, inner.join('')) : inner.join('');
      body += parts.map((x) => x.tables).join('');
    });
    return HEAD + `<p:sld ${NS}><p:cSld name="${esc(page.name)}"><p:spTree><p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr>` +
      '<p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/><a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr>' +
      `${body}</p:spTree></p:cSld><p:clrMapOvr><a:masterClrMapping/></p:clrMapOvr></p:sld>`;
  }

  function buildFiles(doc) {
    const R = window.GamenRender;
    const T = window.GamenPptxTemplate;
    const ctx = R.makeCtx(doc.theme);
    const pages = doc.pages;
    const now = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
    const files = [];

    const ct = '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Override PartName="/ppt/presentation.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.presentation.main+xml"/>' +
      '<Override PartName="/ppt/slideMasters/slideMaster1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slideMaster+xml"/>' +
      '<Override PartName="/ppt/slideLayouts/slideLayout1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slideLayout+xml"/>' +
      pages.map((_, i) => `<Override PartName="/ppt/slides/slide${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slide+xml"/>`).join('') +
      '<Override PartName="/ppt/presProps.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.presProps+xml"/>' +
      '<Override PartName="/ppt/viewProps.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.viewProps+xml"/>' +
      '<Override PartName="/ppt/theme/theme1.xml" ContentType="application/vnd.openxmlformats-officedocument.theme+xml"/>' +
      '<Override PartName="/ppt/tableStyles.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.tableStyles+xml"/>' +
      '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>' +
      '<Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/></Types>';
    files.push({ name: '[Content_Types].xml', data: HEAD + ct });

    files.push({ name: '_rels/.rels', data: HEAD + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      `<Relationship Id="rId1" Type="${REL}/officeDocument" Target="ppt/presentation.xml"/>` +
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>' +
      `<Relationship Id="rId3" Type="${REL}/extended-properties" Target="docProps/app.xml"/></Relationships>` });

    files.push({ name: 'docProps/core.xml', data: HEAD + '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" ' +
      'xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:dcmitype="http://purl.org/dc/dcmitype/" ' +
      'xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">' +
      `<dc:title>${esc(doc.title || '画面イメージ')}</dc:title><dc:creator>画面イメージエディタ</dc:creator><cp:revision>1</cp:revision>` +
      `<dcterms:created xsi:type="dcterms:W3CDTF">${now}</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">${now}</dcterms:modified></cp:coreProperties>` });

    files.push({ name: 'docProps/app.xml', data: HEAD + '<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties" ' +
      'xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes">' +
      `<Application>Microsoft Office PowerPoint</Application><Slides>${pages.length}</Slides><AppVersion>16.0000</AppVersion></Properties>` });

    const sldIds = pages.map((_, i) => `<p:sldId id="${256 + i}" r:id="rId${10 + i}"/>`).join('');
    files.push({ name: 'ppt/presentation.xml', data: HEAD + `<p:presentation ${NS} saveSubsetFonts="1">` +
      '<p:sldMasterIdLst><p:sldMasterId id="2147483648" r:id="rId1"/></p:sldMasterIdLst>' +
      `<p:sldIdLst>${sldIds}</p:sldIdLst>` +
      `<p:sldSz cx="${emu(doc.size.w)}" cy="${emu(doc.size.h)}"/><p:notesSz cx="6858000" cy="9144000"/>` +
      '<p:defaultTextStyle><a:lvl1pPr marL="0" algn="l" defTabSz="914400" rtl="0" eaLnBrk="1" latinLnBrk="0" hangingPunct="1">' +
      '<a:defRPr sz="1800" kern="1200"><a:solidFill><a:schemeClr val="tx1"/></a:solidFill><a:latin typeface="+mn-lt"/><a:ea typeface="+mn-ea"/><a:cs typeface="+mn-cs"/></a:defRPr>' +
      '</a:lvl1pPr></p:defaultTextStyle></p:presentation>' });

    files.push({ name: 'ppt/_rels/presentation.xml.rels', data: HEAD + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      `<Relationship Id="rId1" Type="${REL}/slideMaster" Target="slideMasters/slideMaster1.xml"/>` +
      `<Relationship Id="rId2" Type="${REL}/presProps" Target="presProps.xml"/>` +
      `<Relationship Id="rId3" Type="${REL}/viewProps" Target="viewProps.xml"/>` +
      `<Relationship Id="rId4" Type="${REL}/theme" Target="theme/theme1.xml"/>` +
      `<Relationship Id="rId5" Type="${REL}/tableStyles" Target="tableStyles.xml"/>` +
      pages.map((_, i) => `<Relationship Id="rId${10 + i}" Type="${REL}/slide" Target="slides/slide${i + 1}.xml"/>`).join('') +
      '</Relationships>' });

    files.push({ name: 'ppt/presProps.xml', data: HEAD + `<p:presentationPr ${NS}/>` });
    files.push({ name: 'ppt/viewProps.xml', data: HEAD + `<p:viewPr ${NS}><p:normalViewPr><p:restoredLeft sz="15620"/><p:restoredTop sz="94660"/></p:normalViewPr><p:gridSpacing cx="76200" cy="76200"/></p:viewPr>` });
    files.push({ name: 'ppt/tableStyles.xml', data: HEAD + '<a:tblStyleLst xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" def="{5C22544A-7EE6-4342-B048-85BDC9FD1C3A}"/>' });

    files.push({ name: 'ppt/slideMasters/slideMaster1.xml', data: T.master });
    files.push({ name: 'ppt/slideMasters/_rels/slideMaster1.xml.rels', data: HEAD + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      `<Relationship Id="rId1" Type="${REL}/slideLayout" Target="../slideLayouts/slideLayout1.xml"/>` +
      `<Relationship Id="rId2" Type="${REL}/theme" Target="../theme/theme1.xml"/></Relationships>` });
    files.push({ name: 'ppt/slideLayouts/slideLayout1.xml', data: T.layout });
    files.push({ name: 'ppt/slideLayouts/_rels/slideLayout1.xml.rels', data: HEAD + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      `<Relationship Id="rId1" Type="${REL}/slideMaster" Target="../slideMasters/slideMaster1.xml"/></Relationships>` });
    files.push({ name: 'ppt/theme/theme1.xml', data: T.theme });

    pages.forEach((page, i) => {
      files.push({ name: `ppt/slides/slide${i + 1}.xml`, data: slideXml(page, ctx, R) });
      files.push({ name: `ppt/slides/_rels/slide${i + 1}.xml.rels`, data: HEAD + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        `<Relationship Id="rId1" Type="${REL}/slideLayout" Target="../slideLayouts/slideLayout1.xml"/></Relationships>` });
    });
    return files;
  }

  function build(doc) {
    const blob = window.GamenZip.makeZip(buildFiles(doc));
    return new Blob([blob], { type: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' });
  }

  window.GamenPptx = { build, buildFiles };
})();

</script>
